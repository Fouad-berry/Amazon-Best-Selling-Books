name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m flake8 src/ --max-line-length=120
      - run: python -m pytest tests/
      - run: python src/transformation/clean_transform.py
      - run: python src/analysis/metrics.py
